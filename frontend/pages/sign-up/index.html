<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Create an account</title>
  <link rel="stylesheet" href="/styles/tokens.css">
  <link rel="stylesheet" href="/styles/base.css">
</head>
<body>
  <main class="page-centre">
    <section class="card" aria-labelledby="page-title">
      <h1 id="page-title">Create an account</h1>

      <div class="error-summary" role="alert" tabindex="-1" hidden>
        <p>Please fix the following:</p>
        <ul></ul>
      </div>

      <form id="sign-up-form" novalidate>
        <div class="field">
          <label for="full_name">Name</label>
          <input id="full_name" name="full_name" type="text" autocomplete="name" maxlength="100" aria-describedby="full_name-error" required>
          <p class="field-error" id="full_name-error" hidden></p>
        </div>

        <div class="field">
          <label for="email">Email</label>
          <input id="email" name="email" type="email" autocomplete="email" maxlength="200" aria-describedby="email-error" required>
          <p class="field-error" id="email-error" hidden></p>
        </div>

        <div class="field">
          <label for="password">Password</label>
          <input id="password" name="password" type="password" autocomplete="new-password" maxlength="128" aria-describedby="password-hint password-error" required>
          <p class="field-hint" id="password-hint">At least 8 characters.</p>
          <p class="field-error" id="password-error" hidden></p>
        </div>

        <button class="button button-primary button-wide" type="submit">Create account</button>
      </form>

      <p class="below-form">Already have an account? <a id="sign-in-link" href="/pages/sign-in/">Sign in</a></p>
    </section>
  </main>
  <script type="module" src="/pages/sign-up/sign-up.js"></script>
</body>
</html>
